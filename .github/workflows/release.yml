name: Release

# Este workflow es el dueño del camino del tag: pasa el gate, comprueba que el
# tag es exactamente la versión del manifest, publica los tres assets sueltos
# (BRAT los descarga por nombre, no en un zip) y vuelve a comprobar contra lo
# que GitHub tiene de verdad, que es la mitad que se olvida.
#
# `contents: write` vive aquí y en ningún otro sitio. ci.yml corre en cada rama
# y en cada pull request y se queda en `contents: read`: darle permiso de
# escritura para poder publicar sería dárselo también a cualquier rama.

on:
  push:
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Si el job `check` de ci.yml ya terminó en success sobre este mismo SHA, no se repite `npm run check`.
      # Ante cualquier duda (sin run, fallido, error de consulta) ok=false y el gate corre como siempre.
      - name: Buscar el check verde de CI para este commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=check&filter=latest" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // ""' 2>/dev/null) || conclusion=""
          if [ "$conclusion" = "success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "ci.yml job 'check' already passed on $GITHUB_SHA: the repeated step is skipped"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "no green 'check' check-run for $GITHUB_SHA (got '${conclusion:-none}'): the gate runs here"
          fi

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci

      # El gate corre DENTRO del job de publicación a propósito, salvo que el paso
      # anterior haya visto el job `check` de ci.yml en success sobre este mismo
      # SHA: entonces no se repite. Si no lo ve, corre como siempre.
      - name: Gate
        if: steps.ci.outputs.ok != 'true'
        run: npm run check

      # `npm run check` termina con el build que deja main.js; sin gate, el build sigue.
      - name: Build (gate omitido, CI en verde)
        if: steps.ci.outputs.ok == 'true'
        run: npm run build

      - name: Rechazar un tag que no sea la versión del manifest
        run: node scripts/verify-release.mjs --tag "$GITHUB_REF_NAME"

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" main.js manifest.json styles.css \
            --title "$TAG" \
            --notes "Lumbre $TAG"

      # Segunda pasada, ahora contra lo que GitHub tiene: prueba que la subida
      # hizo lo que decía el plan, no solo que el comando salió con 0.
      - name: Comprobar la release publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > published.json
          node scripts/verify-release.mjs --published published.json

      - name: Informar del conjunto de assets publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --json tagName,isDraft,assets
